name: nextflow-staging
services:
  front:
    image: nextflow-front:staging
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - 80:80
    networks:
      - nextflow-staging-network
    restart: unless-stopped

networks:
  nextflow-staging-network:
    external: true
