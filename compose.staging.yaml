name: nextflow-staging
services:
  front:
    image: nextflow-front:staging
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Entra no build: mudou, tem que reconstruir a imagem (--build)
        VITE_API_URL: ${VITE_API_URL}
    # Sem "ports": quem recebe de fora é o proxy de borda (nextflow.zanni.tech).
    # Não precisa da rede do backend: é o navegador que chama a API, não o container
    networks:
      proxy-net:
        aliases: [nextflow-web]
    restart: unless-stopped

networks:
  proxy-net:
    external: true
